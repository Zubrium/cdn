# Конфигурация соответствует целевым схемам SPEC-caching.md §7 и
# SPEC-concurrency.md §11. Compatibility aliases не принимаются: старые плоские
# ключи core.cache_max_bytes, core.cache_ttl, core.max_cached_object_bytes,
# loader.max_concurrent_commits и coordinator.worker_concurrency удалены.
core:
  database_url_env: ZUBRIUM_DATABASE_URL
  migration_database_url_env: ZUBRIUM_MIGRATION_DATABASE_URL
  s3_endpoint: http://127.0.0.1:9000
  s3_region: us-east-1
  s3_bucket: zubrium-private
  s3_access_key_env: ZUBRIUM_S3_ACCESS_KEY
  s3_secret_key_env: ZUBRIUM_S3_SECRET_KEY
  s3_path_style: true
  # Only for a trusted local MinIO. Use HTTPS and false for remote storage.
  s3_allow_insecure_http: true
  atlas_binary: atlas
  migration_lock_timeout: 30s
  # An omitted or null level gives the initial administrator level 2.
  # Levels here override engine bootstrap levels for matching group names.
  access_groups:
    content: 2
    features: 2
    forms_schemas: 2
    forms_submissions: 2
    router_routes: 2
    coordinator_jobs: 2
  min_connections: 0
  # Budget: 1 + 2 * loader commits + 2 * sum(worker limits) + storage read_reserve.
  max_connections: 32
  connect_timeout: 10s
  max_lifetime: 1h
  max_idle_time: 10m
  health_interval: 30s
  max_metadata_bytes: 65536
  max_object_bytes: 104857600
  cache:
    max_bytes: 67108864
    ttl: 10m
    max_object_bytes: 2097152
    access_cache:
      max_entries: 10000
      max_bytes: 8388608
      ttl: 1m
    warmup:
      enabled: true
      mode: strict
      timeout: 30s
      per_key_timeout: 5s
      concurrency: 4
      max_keys: 200
      retry:
        attempts: 2
        backoff: 200ms
      refresh_interval: 0s
      sources:
        inline: false
        published_artifacts: true
      targets:
        authorization: false
        metadata: true
        bytes: true
        router_manifests: true
        router_routes: true
      # Server-owned Router publication slots. Each entry contributes its
      # file_id to the Core key set and primes router.manifests/router.routes
      # before engine.router becomes Ready. The empty list is valid for a fresh
      # system with no published artifacts yet.
      published_artifacts: []
      # Operator-supplied Core file IDs, selected only by sources.inline.
      keys: []
  concurrency:
    storage:
      max_concurrent_reads: 16
      max_concurrent_authorizations: 16
      operation_timeout: 10s
      read_reserve: 4
    cache:
      shards: 8
      lru_promotion_interval: 1
      coalesce:
        enabled: true
        max_waiters: 32
        timeout: 5s
    invalidation:
      batch_size: 256
      batch_window: 10ms
  maintenance_interval: 1m
  maintenance_timeout: 30s
  pending_ttl: 1h
  maintenance_batch_size: 100
  session_idle_ttl: 8h
  session_absolute_ttl: 168h
  module_data:
    max_payload_bytes: 1048576
    max_index_bytes: 65536
    max_batch_bytes: 8388608
    max_page_bytes: 16777216
    max_selectors: 16
    max_selector_values: 64
    max_page_size: 100
    max_batch_operations: 64

loader:
  part_size_bytes: 1048576
  max_file_bytes: 104857600
  max_part_bytes: 1048576
  max_parts: 100
  concurrency:
    max_concurrent_commits: 4
    max_concurrent_session_lookups: 8
  session_ttl: 24h
  commit_timeout: 5m
  mode: auto
  buffer_threshold_bytes: 2097152
  max_buffered_bytes: 16777216
  session_cache_entries: 10000
  session_cache_max_bytes: 8388608
  session_cache_ttl: 1m
  cleanup_interval: 1m
  cleanup_batch_size: 100

admin:
  concurrency:
    http:
      max_in_flight: 128
      request_timeout: 30s

router:
  cache:
    manifests:
      enabled: true
      max_entries: 512
      max_bytes: 33554432
      ttl: 5m
    routes:
      enabled: true
      max_entries: 4096
      max_bytes: 8388608
      ttl: 30s
    http:
      compression:
        enabled: true
        algorithms: [gzip]
        min_bytes: 1024
        max_uncompressed_bytes: 8388608
        max_compressed_bytes: 2097152
        media_types:
          - text/html
          - text/css
          - application/javascript
          - application/json
          - image/svg+xml
      vary:
        accept_encoding: true
        locale_from_cookie: no_store
  concurrency:
    http:
      max_in_flight: 512
      request_timeout: 30s
      per_route:
        enabled: false
        default_max_in_flight: 64
        overrides: []
    routes:
      max_concurrent_resolutions: 64

bus:
  concurrency:
    max_in_flight: 256
    per_operation:
      enabled: false
      default_max_in_flight: 32
      overrides: []

worker:
  archive:
    concurrency:
      enabled: true
      limit: 2
      poll_interval: 1s
      task_timeout: 30m
      lease_duration: 30s
  media:
    concurrency:
      enabled: true
      limit: 2
      poll_interval: 1s
      task_timeout: 30m
      lease_duration: 30s
  prerender:
    concurrency:
      enabled: true
      limit: 1
      poll_interval: 1s
      task_timeout: 30m
      lease_duration: 30s
  publication:
    concurrency:
      enabled: true
      limit: 2
      poll_interval: 1s
      task_timeout: 30m
      lease_duration: 30s

file_api:
  max_json_bytes: 1048576
  max_attribute_bytes: 65536
  max_groups_per_file: 16
  default_page_size: 25
  max_page_size: 100

admin_api:
  max_json_bytes: 1048576
  default_page_size: 50
  max_page_size: 200
  # Set true when the admin origin is served over HTTPS.
  session_cookie_secure: false
  allowed_origins:
    - http://127.0.0.1:8080

router_api:
  max_json_bytes: 1048576
  default_page_size: 25
  max_page_size: 100
  # Router service principal is an ordinary Core user with direct group grants.
  # The same scoped credential reads explicitly routed files and uploads via Loader.
  service_credential_env: ZUBRIUM_ROUTER_SERVICE_CREDENTIAL
  # Run one Router process per configured branch. These two values select the
  # process-local branch binding; shared Coordinator settings must match.
  # Router has no request-rate limiter. Keep this listener private behind an
  # external proxy; proxy setup and admission policy belong to the deployer.
  public_listen_address: 127.0.0.1:8081
  upload_max_file_bytes: 104857600
  upload_max_concurrent: 4
  upload_allowed_content_types:
    - application/pdf
    - image/jpeg
    - image/png
  # Public form session cookies are host-only, HttpOnly and SameSite=Strict.
  # Set secure=true whenever this listener is reached through HTTPS.
  form_session_cookie_secure: false
  # Locale preference is host-only, HttpOnly, SameSite=Lax and has no implicit
  # lifetime. Set secure=true whenever this listener is reached over HTTPS.
  locale_preference:
    enabled: true
    secure: false
    max_age: 86400s

forms_api:
  # This ordinary Core user must have write access to the groups used for
  # private form attachments so Forms can clean expired sessions and delete
  # attachments with an explicitly deleted response.
  file_service_credential_env: ZUBRIUM_FORMS_FILE_SERVICE_CREDENTIAL
  visitor_session_ttl: 30m
  visitor_session_cleanup_interval: 1m
  # CSV export has independent per-process concurrency, row and byte bounds.
  export_max_concurrent: 2
  export_max_rows: 10000
  export_max_bytes: 33554432

content_api:
  # This ordinary Core user needs read/write access to the content group and
  # read access to the features group. Content uses it only as a trusted
  # service identity for Website projections; browser clients never receive it.
  service_credential_env: ZUBRIUM_CONTENT_SERVICE_CREDENTIAL
  locale: en-US

# Optional durable page retirement. Every page/route binding is server-owned;
# the DELETE request supplies only a page URL, If-Match and Idempotency-Key.
# retirement:
#   website_credential_env: ZUBRIUM_WEBSITE_SERVICE_CREDENTIAL
#   bindings:
#     - page_id: 00000000-0000-4000-8000-000000000001
#       route_ids:
#         - 00000000-0000-4000-8000-000000000002

# Enable durable feature imports only after an operator-created managed FileSet
# and a service credential with write access to its output groups exist. Without
# this block the compiled archive worker stays fail-closed.
# feature_import:
#   target_file_set_id: 00000000-0000-4000-8000-000000000000
#   output_groups:
#     - features
#   # Must exist, be a real directory, and have mode 0700.
#   staging_directory: /var/lib/zubrium/feature-import-staging
#   service_credential_env: ZUBRIUM_FEATURE_IMPORT_SERVICE_CREDENTIAL
#   max_archive_bytes: 1048576
#   max_entries: 16
#   max_entry_bytes: 65536
#   max_expanded_bytes: 262144
#   max_compression_ratio: 100

http:
  listen_address: 127.0.0.1:8080
  read_header_timeout: 5s
  read_timeout: 15m
  # Zero keeps long file streams open; uploads are bounded by File API limits.
  write_timeout: 0s
  idle_timeout: 2m
  shutdown_timeout: 30s
  max_header_bytes: 65536

# Telemetry is deployment-local: noop by default, file for cheap JSONL output,
# otlp for export through an OpenTelemetry Collector into OpenObserve.
observability:
  mode: noop
  min_level: info
  # service_version: dev
  # instance_id: zubrium-local
  # file:
  #   directory: /var/lib/zubrium/observability
  #   max_file_bytes: 16777216
  #   max_files: 4
  # otlp:
  #   endpoint: http://otel-collector:4318
  #   insecure: true
  #   timeout: 5s
  #   headers_env: ZUBRIUM_OBSERVABILITY_HEADERS

coordinator:
  workflow_access_group: coordinator_jobs
  workflows_page_default: 25
  workflows_page_maximum: 100
  instance_lease: 30s
  heartbeat_interval: 5s
  retry_base: 2s
  retry_maximum: 2m
  max_attempts: 6
  max_workflow_tasks: 10000
  max_children_per_task: 128
  workflow_retention: 720h
