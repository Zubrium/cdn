name: "${COMPOSE_PROJECT_NAME:-website-qa-${WEBSITE_TEST_RUN_ID:-local}}"

services:
  postgres:
    image: postgres:16-alpine
    restart: "no"
    environment:
      POSTGRES_USER: core_qa_admin
      POSTGRES_PASSWORD: ${CORE_QA_POSTGRES_PASSWORD:?set CORE_QA_POSTGRES_PASSWORD}
      CORE_QA_RUNTIME_PASSWORD: ${CORE_QA_RUNTIME_PASSWORD:?set CORE_QA_RUNTIME_PASSWORD}
      CORE_QA_MIGRATION_PASSWORD: ${CORE_QA_MIGRATION_PASSWORD:?set CORE_QA_MIGRATION_PASSWORD}
      CORE_QA_ELEVATED_PASSWORD: ${CORE_QA_ELEVATED_PASSWORD:?set CORE_QA_ELEVATED_PASSWORD}
      CORE_QA_OWNER_RESULT_DATABASE: ${CORE_QA_OWNER_RESULT_DATABASE:-zubrium_core_qa_owner_result_${WEBSITE_TEST_RUN_ID:-local}}
    ports:
      - "127.0.0.1:${QA_PG_PORT:-55432}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ../postgres-init.sh:/docker-entrypoint-initdb.d/10-core-qa.sh:ro
      - ./owner-result-init.sh:/docker-entrypoint-initdb.d/20-owner-result.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U core_qa_admin -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 2s

  minio:
    image: alpine/minio:RELEASE.2025-10-15T17-29-55Z
    restart: "no"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${QA_S3_ACCESS_KEY:?set QA_S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${QA_S3_SECRET_KEY:?set QA_S3_SECRET_KEY}
    ports:
      - "127.0.0.1:${QA_S3_API_PORT:-59000}:9000"
      - "127.0.0.1:${QA_S3_CONSOLE_PORT:-59001}:9001"
    tmpfs:
      - /data
    healthcheck:
      test:
        - CMD-SHELL
        - "wget -q -O /dev/null http://127.0.0.1:9000/minio/health/live 2>/dev/null || curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null 2>&1 || exit 1"
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 3s
