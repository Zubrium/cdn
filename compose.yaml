services:
  core-qa-postgres:
    image: postgres:16-alpine
    restart: "no"
    environment:
      POSTGRES_USER: core_qa_admin
      POSTGRES_PASSWORD: ${CORE_QA_POSTGRES_PASSWORD:?set CORE_QA_POSTGRES_PASSWORD}
      CORE_QA_RUNTIME_PASSWORD: ${CORE_QA_RUNTIME_PASSWORD:?set CORE_QA_RUNTIME_PASSWORD}
      CORE_QA_MIGRATION_PASSWORD: ${CORE_QA_MIGRATION_PASSWORD:?set CORE_QA_MIGRATION_PASSWORD}
      CORE_QA_ELEVATED_PASSWORD: ${CORE_QA_ELEVATED_PASSWORD:?set CORE_QA_ELEVATED_PASSWORD}
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./tests/qa/postgres-init.sh:/docker-entrypoint-initdb.d/10-core-qa.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U core_qa_admin -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Одноразовая БД для observability-стека. Не использовать для рабочих данных.
  obs-postgres:
    profiles: [observability]
    image: postgres:16-alpine
    restart: "no"
    environment:
      POSTGRES_USER: ${OBS_POSTGRES_USER:-obs_admin}
      POSTGRES_PASSWORD: ${OBS_POSTGRES_PASSWORD:?set OBS_POSTGRES_PASSWORD}
      POSTGRES_DB: ${OBS_POSTGRES_DB:-zubrium_obs}
      OBS_POSTGRES_MIGRATION_PASSWORD: ${OBS_POSTGRES_MIGRATION_PASSWORD:?set OBS_POSTGRES_MIGRATION_PASSWORD}
    ports:
      - "127.0.0.1:15432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./deploy/observability/postgres-init.sh:/docker-entrypoint-initdb.d/10-obs-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${OBS_POSTGRES_USER:-obs_admin} -d ${OBS_POSTGRES_DB:-zubrium_obs}"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Одноразовый S3; bucket создаётся отдельным одноразовым obs-minio-init через aws-cli.
  obs-minio:
    profiles: [observability]
    image: alpine/minio:RELEASE.2025-10-15T17-29-55Z
    restart: "no"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${OBS_S3_ACCESS_KEY:?set OBS_S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${OBS_S3_SECRET_KEY:?set OBS_S3_SECRET_KEY}
    ports:
      - "127.0.0.1:15900:9000"
      - "127.0.0.1:15901:9001"
    tmpfs:
      - /data
    healthcheck:
      test:
        - CMD-SHELL
        - "wget -q -O /dev/null http://127.0.0.1:9000/minio/health/live 2>/dev/null || curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null 2>&1 || exit 1"
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 3s

  obs-minio-init:
    profiles: [observability]
    image: amazon/aws-cli:latest
    restart: "no"
    depends_on:
      obs-minio:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${OBS_S3_ACCESS_KEY:?set OBS_S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${OBS_S3_SECRET_KEY:?set OBS_S3_SECRET_KEY}
      AWS_DEFAULT_REGION: us-east-1
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        endpoint=http://obs-minio:9000
        bucket=zubrium-private
        aws s3api head-bucket --endpoint-url "$$endpoint" --bucket "$$bucket" 2>/dev/null || \
          aws s3api create-bucket --endpoint-url "$$endpoint" --bucket "$$bucket"

  openobserve:
    profiles: [observability]
    image: public.ecr.aws/zinclabs/openobserve:latest
    restart: "no"
    environment:
      ZO_ROOT_USER_EMAIL: ${OBS_OPENOBSERVE_EMAIL:?set OBS_OPENOBSERVE_EMAIL}
      ZO_ROOT_USER_PASSWORD: ${OBS_OPENOBSERVE_PASSWORD:?set OBS_OPENOBSERVE_PASSWORD}
      ZO_DATA_DIR: /data
    ports:
      - "127.0.0.1:15080:5080"
    volumes:
      # Единственный named volume: телеметрия должна переживать пересоздание контейнера.
      - openobserve-data:/data

  otel-collector:
    profiles: [observability]
    image: otel/opentelemetry-collector-contrib:latest
    restart: "no"
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    depends_on:
      openobserve:
        condition: service_started
    environment:
      # Base64 от email:password; значение приходит из host env, в YAML секрета нет.
      OBS_OPENOBSERVE_AUTH: ${OBS_OPENOBSERVE_AUTH:?set OBS_OPENOBSERVE_AUTH}
    ports:
      - "127.0.0.1:14318:4318"
      - "127.0.0.1:14317:4317"
    volumes:
      - ./deploy/observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro

  zubrium-obs:
    profiles: [observability]
    build:
      # Dockerfile ожидает context корня репозитория: он копирует go.work и модули.
      context: .
      dockerfile: main/Dockerfile
      args:
        BUILD_TAGS: full
    restart: "no"
    depends_on:
      obs-postgres:
        condition: service_healthy
      obs-minio-init:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
    environment:
      # Одноразовый демо-стек: раздельные роли для runtime и Atlas обязательны.
      ZUBRIUM_DATABASE_URL: "postgres://${OBS_POSTGRES_USER:-obs_admin}:${OBS_POSTGRES_PASSWORD:?set OBS_POSTGRES_PASSWORD}@obs-postgres:5432/${OBS_POSTGRES_DB:-zubrium_obs}?sslmode=disable"
      ZUBRIUM_MIGRATION_DATABASE_URL: "postgres://obs_migrator:${OBS_POSTGRES_MIGRATION_PASSWORD:?set OBS_POSTGRES_MIGRATION_PASSWORD}@obs-postgres:5432/${OBS_POSTGRES_DB:-zubrium_obs}?sslmode=disable"
      ZUBRIUM_S3_ACCESS_KEY: ${OBS_S3_ACCESS_KEY:?set OBS_S3_ACCESS_KEY}
      ZUBRIUM_S3_SECRET_KEY: ${OBS_S3_SECRET_KEY:?set OBS_S3_SECRET_KEY}
      ZUBRIUM_ROUTER_SERVICE_CREDENTIAL: ${OBS_ROUTER_CREDENTIAL:?set OBS_ROUTER_CREDENTIAL}
      ZUBRIUM_FORMS_FILE_SERVICE_CREDENTIAL: ${OBS_FORMS_CREDENTIAL:?set OBS_FORMS_CREDENTIAL}
      ZUBRIUM_CONTENT_SERVICE_CREDENTIAL: ${OBS_CONTENT_CREDENTIAL:?set OBS_CONTENT_CREDENTIAL}
      ZUBRIUM_BOOTSTRAP_SECRET: ${OBS_BOOTSTRAP_SECRET:?set OBS_BOOTSTRAP_SECRET}
      # Несекретный пример заголовка для headers_env из конфига.
      ZUBRIUM_OBS_OTLP_HEADERS: "X-OBS-STACK=observability"
    ports:
      - "127.0.0.1:18080:8080"
      - "127.0.0.1:18081:8081"
    user: "1000:1000"
    tmpfs:
      # Владелец совпадает с user: непривилегированный процесс создаёт staging и JSONL.
      - /var/lib/zubrium:uid=1000,gid=1000,mode=0700
    volumes:
      - ./main/config.observability.yaml:/etc/zubrium/config.yaml:ro
    command: ["--config", "/etc/zubrium/config.yaml"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 10s

volumes:
  openobserve-data:
