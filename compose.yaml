name: website-engine
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Configure POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Configure POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
  minio:
    image: coollabsio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?Configure S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?Configure S3_SECRET_KEY}
    volumes:
      - minio-data:/data
  server:
    image: ${ENGINE_IMAGE:?Configure ENGINE_IMAGE}
    pull_policy: always
    init: true
    env_file: .env
    # Permit Chromium's sandbox namespaces; see SPEC-seo.md for platform requirements.
    security_opt:
      - seccomp=./deploy/seccomp-prerender.json
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    volumes:
      - engine-data:/data
    # Keep this explicit list in sync with the BRANCHES configuration.
    ports:
      - "127.0.0.1:8080:8080"
      - "8081:8081"
      - "8082:8082"
    restart: unless-stopped
volumes:
  postgres-data:
  minio-data:
  engine-data:
