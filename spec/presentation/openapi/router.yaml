openapi: 3.1.0
info:
  title: Zubrium Router API
  version: 2.0.0
  description: >-
    Router settings are authenticated. Public delivery is matched only against
    explicitly configured routes and dispatches only registered operations;
    the default public response cache policy is no-store. Allowed public
    Cache-Control values, Vary rules, compression and cache warm-up are defined
    by SPEC-caching.md (spec/architecture/SPEC-caching.md). Router Presentation
    owns form-session cookies; Forms Engine receives only a typed session token.
servers: [{ url: / }]
security:
  - AdminSession: []
  - BearerCredential: []
x-rejects-cookie-and-bearer-together: true
x-locale-resolution:
  order: [valid-route-supported-cookie, accept-language, default-locale]
  locale_cookie: { name: zubrium_locale, httpOnly: true, sameSite: Lax, path: '/', domain: omitted, secure: explicit-startup-setting, maxAge: required-startup-setting }
  accept_language: { quality_order: descending, tie_break: header-order, matching: RFC4647-Lookup, wildcard: default-locale }
  locale_in_path_or_query: false
  cache_policy:
    cookie_selected_locale: no-store
    accept_language_selected_locale: vary-accept-language
    vary_cookie: forbidden
  preference_operation: public.locale-preference
paths:
  /api/admin/router/operations:
    get:
      operationId: listPublicOperations
      x-required-group-level: { group: router_routes, level: 1 }
      responses:
        '200':
          description: Compiled public operations available to configure in this build.
          content: { application/json: { schema: { $ref: '#/components/schemas/PublicOperationPage' } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /api/admin/router/routes:
    get:
      operationId: listRoutes
      x-required-group-level: { group: router_routes, level: 1 }
      parameters:
        - { name: host, in: query, schema: { type: string, maxLength: 253 } }
        - { name: cursor, in: query, schema: { type: string, maxLength: 1024 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200': { description: Routes for the configured branch., content: { application/json: { schema: { $ref: '#/components/schemas/RoutePage' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      operationId: createRoute
      x-required-group-level: { group: router_routes, level: 2 }
      x-csrf-required-for-cookie-auth: true
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 16, maxLength: 128, pattern: '^[A-Za-z0-9._:-]+$' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateRoute' } } }
      responses:
        '201':
          description: Route created.
          headers: { Location: { schema: { type: string } }, ETag: { schema: { type: string } } }
          content: { application/json: { schema: { $ref: '#/components/schemas/Route' } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/admin/router/routes/{id}:
    get:
      operationId: getRoute
      x-required-group-level: { group: router_routes, level: 1 }
      parameters: [{ $ref: '#/components/parameters/ID' }]
      responses:
        '200': { description: Route and its current revision., headers: { ETag: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/Route' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteRoute
      x-required-group-level: { group: router_routes, level: 2 }
      x-csrf-required-for-cookie-auth: true
      parameters:
        - { $ref: '#/components/parameters/ID' }
        - { $ref: '#/components/parameters/IfMatch' }
      responses:
        '204': { description: Route deleted. }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/admin/router/routes/{id}/target:
    put:
      operationId: replaceRouteTarget
      x-required-group-level: { group: router_routes, level: 2 }
      x-csrf-required-for-cookie-auth: true
      parameters:
        - { $ref: '#/components/parameters/ID' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [target], properties: { target: { $ref: '#/components/schemas/RouteTarget' } } }
      responses:
        '200': { description: Target replaced., headers: { ETag: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/Route' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
  /api/locale-preference:
    post:
      operationId: setPublicLocalePreference
      security: []
      x-registered-public-operation: public.locale-preference
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [locale, return_path]
              properties:
                locale: { type: string, minLength: 2, maxLength: 64, description: Canonical supported BCP 47 locale for the route resolved by return_path. }
                return_path: { type: string, minLength: 1, maxLength: 2048, description: Same-origin relative path; external URLs, fragments and ambiguous encoded paths are rejected. }
      responses:
        '303':
          description: Preference cookie set; redirect to the validated same-origin path.
          headers:
            Location: { schema: { type: string } }
            Set-Cookie: { schema: { type: string }, description: HttpOnly host-only locale preference cookie with configured lifetime. }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /:
    x-public-route-match: all-paths-not-under-configured-admin-prefixes
    x-cache-default: no-store
    x-cache-control-allowlist: ['no-store', 'public, max-age=<uint>', 'public, max-age=<uint>, immutable']
    x-cache-vary: { accept_language: conditional, accept_encoding: when-compressed, cookie: forbidden }
    x-prefix-match: complete-path-segment
    x-exact-route-precedence: exact-wins-then-longest-prefix
    x-max-normalized-path-segments: 31
    x-public-content-runtime-operation:
      methods: [GET, HEAD]
      config_schema: '#/components/schemas/PublicContentRuntimeRouteConfig'
      success_response:
        status: 200
        cache-control: no-store
        etag: content_revision quoted as a strong validator
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [snapshot_id, locale, content_revision, records, selections]
              properties:
                snapshot_id: { type: string, format: uuid }
                locale: { type: string, pattern: '^[A-Za-z0-9_-]{1,35}$' }
                content_revision: { type: integer, format: int64 }
                records: { type: array, items: { type: object } }
                selections: { type: array, items: { type: object } }
        head: { status: 200, body: none, same_headers: true }
        not_modified: { status: 304, body: none, when: If-None-Match matches the strong ETag }
      body: none
      visitor_inputs: none
      errors: [400, 404, 503]
    get:
      operationId: deliverConfiguredPublicGET
      security: []
      description: >-
        Go's Router adapter dispatches the complete escaped request path to its
        configured route table. This root operation documents that catch-all;
        public routes are never inferred from request-supplied target IDs.
        For `public.form-session`, GET reads the caller's fixed form session.
        Router reads the HTTP-only form cookie and forwards the token only in
        the typed operation envelope.
      responses:
        '200':
          description: Form session state, or configured file/artifact response.
          headers:
            Set-Cookie: { schema: { type: string }, description: Router may refresh the session cookie. }
          content: { application/json: { schema: { $ref: '#/components/schemas/PublicFormSession' } } }
        '404': { $ref: '#/components/responses/Error' }
        default: { description: Configured response, redirect, or 503. }
    head:
      operationId: deliverConfiguredPublicHEAD
      security: []
      description: >-
        HEAD follows the same explicit route binding and authorization checks as
        GET, while omitting the response body.
      responses:
        default: { description: Configured response headers or 404. }
    post:
      operationId: deliverConfiguredPublicPOST
      security: []
      x-request-body-streamed: true
      x-rate-limit-client-ip-owner: deployer-managed-proxy
      x-router-has-client-ip-rate-limiter: false
      x-deployment-requires-external-proxy: true
      x-proxy-configuration-owner: deployer
      x-proxy-admission-policy-owner: deployer
      x-proxy-cache-policy-owner: deployer
      x-proxy-cache-must-honor-origin: [Cache-Control, ETag, Vary]
      x-idempotency-key-required-operations: [public.form-upload, public.form-submit]
      x-router-form-cookie: >-
        Router Presentation reads and writes one host-only, HttpOnly, SameSite=Strict
        cookie per fixed form ID. Secure is explicit deployment configuration; with
        Secure enabled the name is __Host-zubrium-form-<form_id>, otherwise it is
        zubrium_form_<form_id>. Cookies use Path=/, omit Domain, and are never JSON.
      x-public-form-session-operation:
        methods: { POST: create-or-resume, GET: read, DELETE: cancel }
        post_responses: [200, 201]
        cookie_transport: router-presentation-only
      x-public-form-submit-operation:
        method: POST
        body: { values: object }
        cookie_transport: router-presentation-only
        idempotency_key_required: true
        success_status: 201
        preserves_cookie_for_idempotent_retry: true
      x-registered-operation-success-response:
        public.form-upload:
          status: 201
          content: { application/json: { schema: { $ref: '#/components/schemas/PublicUploadResult' } } }
        public.form-submit:
          status: 201
          content: { application/json: { schema: { $ref: '#/components/schemas/PublicFormSubmissionReceipt' } } }
        public.form-session:
          statuses: [200, 201]
          content: { application/json: { schema: { $ref: '#/components/schemas/PublicFormSession' } } }
      x-request-body-required-operations: [public.form-upload, public.form-submit]
      x-request-body-optional-operations: [public.form-session]
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: Required for public.form-upload and public.form-submit.
          schema: { type: string, minLength: 16, maxLength: 128, pattern: '^[A-Za-z0-9._:-]+$' }
        - name: field
          in: query
          required: false
          description: Required only when `public.form-upload` has a configured form binding; omitted for standalone uploads and all other operations.
          schema: { type: string, pattern: '^[a-z][a-z0-9_]{0,63}$' }
      requestBody:
        required: false
        description: >-
          public.form-submit uses a JSON {values:{...}} object. public.form-upload
          uses one raw file body whose Content-Type must match the exact allowlist
          in route config. public.form-session POST has no body.
        content:
          application/json: { schema: { $ref: '#/components/schemas/PublicFormSubmissionInput' } }
          '*/*': { schema: { type: string, format: binary } }
      responses:
        '200':
          description: Active form session resumed or upload idempotently replayed.
          headers: { Set-Cookie: { schema: { type: string }, description: Router may refresh or clear the session cookie when required by session state. } }
          content: { application/json: { schema: { oneOf: [{ $ref: '#/components/schemas/PublicFormSession' }, { $ref: '#/components/schemas/PublicFormUploadResult' }] } } }
        '201':
          description: Session created, form response accepted, or file uploaded.
          headers: { Set-Cookie: { schema: { type: string }, description: Router sets the cookie for a new session; successful form submission preserves it for idempotent retry. } }
          content: { application/json: { schema: { oneOf: [{ $ref: '#/components/schemas/PublicFormSession' }, { $ref: '#/components/schemas/PublicFormSubmissionReceipt' }, { $ref: '#/components/schemas/PublicUploadResult' }, { $ref: '#/components/schemas/PublicFormUploadResult' }] } } }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '429':
          description: >-
            An external deployment proxy may reject the request. Router itself
            does not implement request-rate limiting; proxy behavior belongs
            to the deployer.
        default: { description: Configured operation response, 404, 413 or 503. }
    put:
      operationId: deliverConfiguredPublicPUT
      security: []
      x-request-body-streamed: true
      requestBody:
        required: true
        content: { '*/*': { schema: { type: string, format: binary } } }
      responses:
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        default: { description: Configured operation response or 503. }
    patch:
      operationId: deliverConfiguredPublicPATCH
      security: []
      x-request-body-streamed: true
      requestBody:
        required: true
        content: { '*/*': { schema: { type: string, format: binary } } }
      responses:
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        default: { description: Configured operation response or 503. }
    delete:
      operationId: deliverConfiguredPublicDELETE
      security: []
      x-public-form-session-operation: { method: DELETE, behavior: cancel, cookie_transport: router-presentation-only }
      responses:
        '204':
          description: Form session cancelled if active; Router expires its cookie.
          headers: { Set-Cookie: { schema: { type: string }, description: Expired host-only form-session cookie. } }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        default: { description: Configured operation response or 503. }
components:
  securitySchemes:
    AdminSession: { type: apiKey, in: cookie, name: zubrium_admin_session }
    BearerCredential: { type: http, scheme: bearer }
  parameters:
    ID: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    IfMatch: { name: If-Match, in: header, required: true, schema: { type: string, pattern: '^"[1-9][0-9]*"$' } }
  schemas:
    RouteTarget:
      type: object
      additionalProperties: false
      required: [kind]
      allOf:
        - if: { properties: { kind: { const: static-page-artifact } } }
          then: { required: [default_locale, locale_targets], properties: { disposition: false } }
        - if: { properties: { kind: { const: core-file } } }
          then:
            required: [file_id]
            properties: { disposition: { type: string, enum: [inline, attachment] } }
        - if: { properties: { kind: { const: registered-operation } } }
          then: { required: [operation_id], properties: { disposition: false } }
      description: >-
        A core-file target serves exactly the configured file_id at an exact
        route path via GET/HEAD. It never accepts a visitor-selected ID or
        resolves files through FileSets. Its optional disposition is stored on
        the target, never taken from a visitor query. A static-site-artifact target binds
        one ready manifest per configured locale plus a default_locale included
        in that map. Router negotiates locale from its preference cookie,
        Accept-Language and default locale; neither path nor query selects it.
        Each selected manifest serves its one document, while paths below a
        prefix route resolve only to declared assets in that manifest. Unknown
        asset paths return 404; artifacts have no fallback. Prefix matching uses
        complete path segments; exact matches win, otherwise the longest prefix
        wins. Registered operations use exact path matching and enforce their methods.
      properties:
        kind: { type: string, enum: [core-file, static-site-artifact, registered-operation] }
        file_id: { type: string, format: uuid }
        disposition:
          type: string
          enum: [inline, attachment]
          description: >-
            core-file only. Defaults to inline when Core reports an allowlisted
            web media type; any other media type is always attachment. An
            explicit attachment overrides an otherwise inline-safe type.
        default_locale: { type: string, minLength: 2, maxLength: 64 }
        locale_targets:
          type: array
          minItems: 1
          maxItems: 256
          uniqueItems: true
          x-unique-by: locale
          description: Complete locale catalog in catalog order; locale values must be unique and default_locale must be included.
          items: { $ref: '#/components/schemas/LocaleArtifactTarget' }
        operation_id: { type: string, pattern: '^public\.[A-Za-z0-9._-]+$' }
        operation_config:
          type: object
          description: >-
            Strict schema is selected by operation_id. For public.form-upload use
            PublicUploadRouteConfig; unrecognized fields are rejected.
          x-operation-config-schemas:
            public.form-upload: { $ref: '#/components/schemas/PublicUploadRouteConfig' }
            public.form-session: { $ref: '#/components/schemas/PublicFormBinding' }
            public.form-submit: { $ref: '#/components/schemas/PublicFormBinding' }
            public.content-runtime: { $ref: '#/components/schemas/PublicContentRuntimeRouteConfig' }
          additionalProperties: false
    LocaleArtifactTarget:
      type: object
      additionalProperties: false
      required: [locale, artifact_manifest_file_id]
      properties:
        locale: { type: string, minLength: 2, maxLength: 64, description: Canonical supported BCP 47 tag. }
        artifact_manifest_file_id: { type: string, format: uuid }
    PublicUploadRouteConfig:
      type: object
      additionalProperties: false
      description: >-
        One raw file per request. Loader session expiry and multipart part limits
        are controlled by explicit Loader startup configuration; staging limits
        are controlled by the Router operation deployment configuration.
      required: [enabled, access_group, max_bytes, allowed_content_types]
      properties:
        enabled: { const: true }
        access_group: { type: string, pattern: '^[a-z][a-z0-9_-]{0,63}$' }
        file_set_id: { type: string, format: uuid }
        max_bytes: { type: integer, minimum: 1 }
        allowed_content_types:
          type: array
          minItems: 1
          maxItems: 32
          uniqueItems: true
          items:
            type: string
            pattern: '^[A-Za-z0-9!#$&^_.+-]+/[A-Za-z0-9!#$&^_.+-]+$'
          description: Exact MIME allowlist; active browser content types are rejected.
        form:
          allOf:
            - { $ref: '#/components/schemas/PublicFormBinding' }
          description: >-
            Optional form binding. When present, file_set_id is mandatory and
            each request must include the HTTP-only form cookie and `?field=<field_id>`.
      allOf:
        - if: { required: [form] }
          then: { required: [file_set_id] }
      examples:
        - enabled: true
          access_group: public_uploads
          file_set_id: 01938f7a-68af-7c10-a51d-78b6ca125301
          max_bytes: 10485760
          allowed_content_types: [image/jpeg, image/png, application/pdf]
    PublicContentRuntimeRouteConfig:
      type: object
      additionalProperties: false
      description: >-
        Strict server-side deployment configuration for public.content-runtime.
        Unknown fields are rejected. No visitor value can override these fields.
      required: [enabled, page_snapshot_id, locale]
      properties:
        enabled: { const: true }
        page_snapshot_id:
          type: string
          format: uuid
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
          description: Canonical immutable Website page snapshot selected by the deployment.
        locale: { type: string, pattern: '^[A-Za-z0-9_-]{1,35}$' }
    PublicFormBinding:
      type: object
      additionalProperties: false
      required: [enabled, form_id, schema_version]
      properties:
        enabled: { const: true }
        form_id: { type: string, format: uuid, description: Globally unique schema ID selected by the deployment. }
        schema_version: { type: integer, minimum: 1 }
    # Local copy of the Forms field contract: Router must not import another
    # module's OpenAPI document. Equivalence is enforced by the isolation test.
    PublicFieldDefinition:
      oneOf:
        - type: object
          additionalProperties: false
          required: [type, required]
          properties:
            type: { const: text }
            required: { type: boolean }
            min_length: { type: integer, minimum: 0, maximum: 1048576 }
            max_length: { type: integer, minimum: 1, maximum: 1048576 }
            pattern: { type: string, maxLength: 256, description: Go RE2 regular expression. }
        - type: object
          additionalProperties: false
          required: [type, required]
          properties:
            type: { const: email }
            required: { type: boolean }
            min_length: { type: integer, minimum: 0, maximum: 1048576 }
            max_length: { type: integer, minimum: 1, maximum: 1048576 }
            pattern: { type: string, maxLength: 256, description: Go RE2 regular expression. }
        - type: object
          additionalProperties: false
          required: [type, required]
          properties:
            type: { const: number }
            required: { type: boolean }
            minimum: { type: number }
            maximum: { type: number }
        - type: object
          additionalProperties: false
          required: [type, required]
          properties:
            type: { const: boolean }
            required: { type: boolean }
        - type: object
          additionalProperties: false
          required: [type, required, options]
          properties:
            type: { const: select }
            required: { type: boolean }
            options:
              type: array
              minItems: 1
              maxItems: 128
              uniqueItems: true
              items: { type: string, minLength: 1, maxLength: 256 }
        - type: object
          additionalProperties: false
          required: [type, required, max_files, max_file_bytes, allowed_content_types]
          properties:
            type: { const: file }
            required: { type: boolean }
            max_files: { type: integer, minimum: 1, maximum: 20 }
            max_file_bytes: { type: integer, minimum: 1 }
            allowed_content_types:
              type: array
              minItems: 1
              maxItems: 32
              uniqueItems: true
              items:
                type: string
                pattern: '^[A-Za-z0-9!#$&^_.+-]+/[A-Za-z0-9!#$&^_.+-]+$'
              description: Exact non-active MIME type. Active types are rejected case-insensitively by the server.
              not: { enum: [application/ecmascript, application/javascript, application/x-httpd-php, application/xhtml+xml, application/xml, image/svg+xml, text/css, text/html, text/javascript, text/xml] }
    PublicFormSession:
      type: object
      additionalProperties: false
      required: [id, form_id, schema_version, fields, expires_at, completed]
      properties:
        id: { type: string, format: uuid }
        form_id: { type: string, format: uuid }
        schema_version: { type: integer, minimum: 1 }
        fields:
          type: object
          additionalProperties: { $ref: '#/components/schemas/PublicFieldDefinition' }
        expires_at: { type: string, format: date-time }
        completed: { type: boolean }
    PublicFormSubmissionInput:
      type: object
      additionalProperties: false
      required: [values]
      properties: { values: { type: object, maxProperties: 128, additionalProperties: true } }
    PublicFormSubmissionReceipt:
      type: object
      additionalProperties: false
      required: [id, created_at]
      properties:
        id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
    PublicFormUploadResult:
      type: object
      additionalProperties: false
      required: [attachment_id, field_id]
      properties:
        attachment_id: { type: string, format: uuid }
        field_id: { type: string, pattern: '^[a-z][a-z0-9_]{0,63}$' }
    PublicUploadResult:
      type: object
      additionalProperties: false
      required: [file_id]
      properties:
        file_id: { type: string, format: uuid }
        file_set_id: { type: string, format: uuid }
    PublicOperationDescriptor:
      type: object
      additionalProperties: false
      required: [id, contract_version, methods, max_request_bytes, allowed_content_types]
      properties:
        id: { type: string, pattern: '^public\.[A-Za-z0-9._-]+$' }
        contract_version: { type: integer, minimum: 1 }
        methods:
          type: array
          minItems: 1
          maxItems: 6
          uniqueItems: true
          items: { type: string, enum: [GET, HEAD, POST, PUT, PATCH, DELETE] }
        max_request_bytes: { type: integer, minimum: 1 }
        allowed_content_types:
          type: array
          minItems: 1
          maxItems: 32
          uniqueItems: true
          items:
            type: string
            pattern: '^[A-Za-z0-9!#$&^_.+-]+/[A-Za-z0-9!#$&^_.+-]+$'
    PublicOperationPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/PublicOperationDescriptor' }
    CreateRoute:
      type: object
      additionalProperties: false
      required: [host, path, match, target]
      allOf:
        - if:
            properties:
              target:
                properties:
                  kind: { const: core-file }
          then:
            properties:
              match: { const: exact }
        - if:
            properties:
              target:
                properties:
                  kind: { const: registered-operation }
          then:
            properties:
              match: { const: exact }
      properties:
        host:
          type: string
          maxLength: 253
          pattern: '^[A-Za-z0-9](?:[A-Za-z0-9-]*[A-Za-z0-9])?(?:\.[A-Za-z0-9](?:[A-Za-z0-9-]*[A-Za-z0-9])?)*\.?$'
          description: Canonical hostname without a port. Ports, userinfo, paths and wildcard names are rejected; values are lowercased and an optional trailing dot is removed before route matching.
        path: { type: string, maxLength: 2048 }
        match: { type: string, enum: [exact, prefix] }
        target: { $ref: '#/components/schemas/RouteTarget' }
    Route:
      allOf:
        - { $ref: '#/components/schemas/CreateRoute' }
        - type: object
          required: [id, branch_id, state, revision, created_at, updated_at]
          properties:
            id: { type: string, format: uuid }
            state: { type: string }
            revision: { type: integer, minimum: 1 }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
    RoutePage:
      type: object
      required: [items]
      properties: { items: { type: array, items: { $ref: '#/components/schemas/Route' } }, next_cursor: { type: string } }
    Error:
      type: object
      required: [error]
      properties: { error: { type: string } }
  responses:
    Error:
      description: Stable machine-readable error.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
