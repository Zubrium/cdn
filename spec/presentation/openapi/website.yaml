openapi: 3.1.0
info:
  title: Zubrium Website API
  version: 2.0.0
  description: >-
    Website owns feature import, dynamic pages and templates, page-scoped snapshots, builds and media derivative work. Page IDs are generated by Website; routes, URLs, hosts and snapshot-to-route assignments are outside this API. Router owns public route topology and route-to-artifact bindings. Imports accept only a readable Core source-file ID; Website creates its destination FileSet from startup configuration. Admin pagination defaults and limits are configured explicitly at startup.
servers: [{ url: / }]
security:
  - AdminSession: []
  - BearerCredential: []
x-rejects-cookie-and-bearer-together: true
paths:
  /api/admin/feature-imports:
    post:
      operationId: beginFeatureImport
      x-csrf-required-for-cookie-auth: true
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 16, maxLength: 128, pattern: '^[A-Za-z0-9._:-]+$' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [source_file_id]
              properties:
                source_file_id: { type: string, format: uuid }
                expected_sha256: { type: string, pattern: '^[a-fA-F0-9]{64}$' }
      responses:
        '202':
          description: Import work accepted. Website creates its FileSet from startup configuration.
          headers: { Location: { schema: { type: string } } }
          content: { application/json: { schema: { $ref: '#/components/schemas/FeatureImport' } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/admin/feature-imports/{id}:
    get:
      operationId: getFeatureImport
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Current import state., content: { application/json: { schema: { $ref: '#/components/schemas/FeatureImport' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/admin/features:
    get:
      operationId: listFeatureCatalog
      parameters:
        - { name: cursor, in: query, schema: { type: string, maxLength: 1024 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500 } }
      responses:
        '200': { description: Immutable feature versions visible to Website., content: { application/json: { schema: { $ref: '#/components/schemas/FeatureVersionPage' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/admin/features/{featureID}/versions:
    get:
      operationId: listFeatureVersions
      parameters:
        - { name: featureID, in: path, required: true, schema: { type: string } }
        - { name: cursor, in: query, schema: { type: string, maxLength: 1024 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500 } }
      responses:
        '200': { description: Feature version page., content: { application/json: { schema: { $ref: '#/components/schemas/FeatureVersionPage' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/admin/features/{featureID}/versions/{version}:
    get:
      operationId: getFeatureVersion
      parameters:
        - { name: featureID, in: path, required: true, schema: { type: string } }
        - { name: version, in: path, required: true, schema: { type: string, maxLength: 128 } }
      responses:
        '200': { description: Feature version manifest and file index., content: { application/json: { schema: { $ref: '#/components/schemas/FeatureVersion' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/admin/model:
    get:
      operationId: getContentModel
      responses:
        '200': { description: System-wide model revision and digest, independent of page snapshots., headers: { ETag: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/ContentModel' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    put:
      operationId: saveContentModel
      description: Accepts only the source data_model and expected_revision. ContentModel and PagePlacementProjection are server-generated response contracts, never request payloads; page snapshot payloads cannot contain data_model.
      x-csrf-required-for-cookie-auth: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_revision, data_model]
              properties:
                expected_revision: { type: integer, minimum: 0, description: Current system-model revision; zero creates the first revision. }
                data_model: { type: object, description: System-wide formatVersion 1 data model; never stored in a page snapshot. }
      responses:
        '200': { description: System model saved with a new independent revision and digest., headers: { ETag: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/ContentModel' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/admin/pages/{pageID}/snapshots/{snapshotID}/content-projection:
    get:
      operationId: getPagePlacementProjection
      description: Returns the requested page snapshot projection. Outer Presentation combines it with ContentModel and the pinned feature manifest to create Content projections; clients never submit model data to Content endpoints.
      parameters:
        - { name: pageID, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: snapshotID, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Page-scoped placement bindings, revision and digest., content: { application/json: { schema: { $ref: '#/components/schemas/PagePlacementProjection' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/admin/pages:
    get:
      operationId: listPages
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { description: Pages in the system, with each page's latest snapshot metadata., content: { application/json: { schema: { $ref: '#/components/schemas/PagePage' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    post:
      operationId: createPage
      x-csrf-required-for-cookie-auth: true
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 16, maxLength: 128, pattern: '^[A-Za-z0-9._:-]+$' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
                template_id: { type: string, format: uuid }
                template_revision: { type: integer, minimum: 1, description: Required with template_id to bind creation to the exact current template revision. }
              allOf:
                - if: { required: [template_id] }
                  then: { required: [template_revision] }
                - if: { not: { required: [template_id] } }
                  then: { not: { required: [template_revision] } }
      responses:
        '201': { description: New page and its ready root snapshot were created. Website generated page_id; this operation does not create a route., headers: { Location: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/Page' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/admin/pages/{pageID}:
    get:
      operationId: getPage
      parameters:
        - { name: pageID, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Page identity and latest ready snapshot metadata., headers: { ETag: { schema: { type: string, pattern: '^"[1-9][0-9]*"$' } } }, content: { application/json: { schema: { $ref: '#/components/schemas/Page' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      operationId: retirePage
      x-csrf-required-for-cookie-auth: true
      parameters:
        - { name: pageID, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: If-Match, in: header, required: true, schema: { type: string, pattern: '^"[1-9][0-9]*"$' } }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 16, maxLength: 128, pattern: '^[A-Za-z0-9._:-]+$' }
      responses:
        '202': { description: Durable route-withdrawal workflow accepted. Page and snapshots are retained; poll its state until all registered route targets are removed., headers: { Location: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/PageRetirement' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '412': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/admin/pages/{pageID}/retirement/{jobID}:
    get:
      operationId: getPageRetirement
      description: Poll the durable retirement workflow addressed by the Location header.
      parameters:
        - { name: pageID, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: jobID, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Current durable retirement state., content: { application/json: { schema: { $ref: '#/components/schemas/PageRetirement' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/admin/templates:
    get:
      operationId: listPageTemplates
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { description: User-owned templates in the system., content: { application/json: { schema: { $ref: '#/components/schemas/PageTemplatePage' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      operationId: createPageTemplate
      x-csrf-required-for-cookie-auth: true
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 16, maxLength: 128, pattern: '^[A-Za-z0-9._:-]+$' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, description, configuration]
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
                description: { type: string, maxLength: 1000 }
                configuration: { $ref: '#/components/schemas/PageTemplateConfiguration' }
      responses:
        '201': { description: User-owned page template created at revision 1., headers: { Location: { schema: { type: string } }, ETag: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/PageTemplate' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/admin/templates/{templateID}:
    get:
      operationId: getPageTemplate
      parameters:
        - { name: templateID, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Current template revision and configuration., headers: { ETag: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/PageTemplate' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    put:
      operationId: updatePageTemplate
      x-csrf-required-for-cookie-auth: true
      parameters:
        - { name: templateID, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: If-Match, in: header, required: true, schema: { type: string, pattern: '^"[1-9][0-9]*"$' } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, description, configuration]
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
                description: { type: string, maxLength: 1000 }
                configuration: { $ref: '#/components/schemas/PageTemplateConfiguration' }
      responses:
        '200': { description: New current template revision., headers: { ETag: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/PageTemplate' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '412': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deletePageTemplate
      x-csrf-required-for-cookie-auth: true
      parameters:
        - { name: templateID, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: If-Match, in: header, required: true, schema: { type: string, pattern: '^"[1-9][0-9]*"$' } }
      responses:
        '204': { description: Template deleted; pages created from it remain unchanged. }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '412': { $ref: '#/components/responses/Error' }
  /api/admin/pages/{pageID}/template-applications:
    post:
      operationId: applyPageTemplate
      x-csrf-required-for-cookie-auth: true
      parameters:
        - { name: pageID, in: path, required: true, schema: { type: string, format: uuid } }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 16, maxLength: 128, pattern: '^[A-Za-z0-9._:-]+$' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [template_id, template_revision, expected_snapshot_id, expected_snapshot_revision, expected_content_revision, confirmed]
              properties:
                template_id: { type: string, format: uuid }
                template_revision: { type: integer, minimum: 1 }
                expected_snapshot_id: { type: string, format: uuid }
                expected_snapshot_revision: { type: integer, minimum: 1 }
                expected_content_revision: { type: integer, minimum: 0 }
                confirmed: { const: true, description: The caller has shown the complete replacement diff and the selection-reset warning. }
      responses:
        '202': { description: Replacement child snapshot accepted; poll until ready. The old page snapshot and Router binding remain unchanged., headers: { Location: { schema: { type: string } }, ETag: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/Snapshot' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/admin/snapshots:
    get:
      operationId: listSnapshots
      parameters:
        - { name: page_id, in: query, description: Filter snapshots to one dynamically created page tree., schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { description: Snapshot page in the single implicit scope., content: { application/json: { schema: { $ref: '#/components/schemas/SnapshotPage' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    post:
      operationId: createSnapshot
      x-csrf-required-for-cookie-auth: true
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 16, maxLength: 128, pattern: '^[A-Za-z0-9._:-]+$' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [page_id, parent_id, name, expected_revision, expected_content_revision, payload]
              properties:
                page_id: { type: string, format: uuid, description: Website-generated page ID; snapshots form independent trees per page. }
                parent_id: { type: string, format: uuid, description: Parent snapshot must belong to the same page_id tree. }
                name: { type: string, minLength: 1, maxLength: 120 }
                expected_revision: { type: integer, minimum: 1, description: Current parent snapshot revision. }
                expected_content_revision: { type: integer, minimum: 0, description: Current parent Content workspace revision. }
                payload: { $ref: '#/components/schemas/SnapshotPayload' }
      responses:
        '202': { description: Child snapshot created in provisioning state and its durable Content-copy workflow accepted. Poll the snapshot until it becomes ready; retry the same request with the same idempotency key if enqueueing is interrupted., headers: { Location: { schema: { type: string } }, ETag: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/Snapshot' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/admin/snapshots/{snapshotID}:
    get:
      operationId: getSnapshot
      parameters: [{ name: snapshotID, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Snapshot metadata and complete Website-owned payload., headers: { ETag: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/Snapshot' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteSnapshot
      x-csrf-required-for-cookie-auth: true
      parameters:
        - { name: snapshotID, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: If-Match, in: header, required: true, schema: { type: string, pattern: '^"[1-9][0-9]*"$' } }
      responses:
        '204': { description: Snapshot deleted or children reparented after ownership checks. }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '428': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/admin/builds:
    post:
      operationId: buildSnapshot
      x-csrf-required-for-cookie-auth: true
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 16, maxLength: 128 }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, additionalProperties: false, required: [snapshot_id, locale], properties: { snapshot_id: { type: string, format: uuid }, locale: { type: string, minLength: 2, maxLength: 64, description: Must be in the system locale catalog. } } } } }
      responses:
        '202': { description: Build accepted., headers: { Location: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/BuildJob' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/admin/builds/{jobID}:
    get:
      operationId: getBuild
      parameters: [{ name: jobID, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Build state., content: { application/json: { schema: { $ref: '#/components/schemas/BuildJob' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/admin/media/derivatives:
    post:
      operationId: createMediaDerivative
      x-csrf-required-for-cookie-auth: true
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 16, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [snapshot_id, placement_id, schema_kind, field_path, source_file_id]
              properties:
                snapshot_id: { type: string, format: uuid }
                placement_id: { type: string, minLength: 1, maxLength: 128 }
                schema_kind: { type: string, enum: [arguments, dataInputs] }
                field_path: { type: string, minLength: 1, maxLength: 512 }
                source_file_id: { type: string, format: uuid }
              description: Website resolves the exact profile from the selected schema area of the pinned feature manifest; arguments use property paths with items for arrays and JSON Pointer escaping. Clients cannot provide profile or processor parameters.
      responses:
        '202': { description: Derivative workflow accepted from the pinned manifest profile; the editor must keep the previous field value until all outputs are ready., headers: { Location: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/MediaJob' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/admin/media/jobs/{jobID}:
    get:
      operationId: getMediaJob
      parameters: [{ name: jobID, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Derivative state., content: { application/json: { schema: { $ref: '#/components/schemas/MediaJob' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    AdminSession: { type: apiKey, in: cookie, name: zubrium_admin_session }
    BearerCredential: { type: http, scheme: bearer }
  parameters:
    Cursor: { name: cursor, in: query, schema: { type: string, maxLength: 1024 } }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500 } }
  schemas:
    FeatureImport:
      type: object
      required: [id, source_file_id, state, source_deleted, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        source_file_id: { type: string, format: uuid }
        feature_id: { type: string }
        version: { type: string }
        file_set_id: { type: string, format: uuid }
        state: { type: string, enum: [queued, running, succeeded, failed, cancelled] }
        error_code: { type: string }
        source_deleted: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    FeatureVersionPage:
      type: object
      required: [items]
      properties: { items: { type: array, items: { $ref: '#/components/schemas/FeatureVersion' } }, next_cursor: { type: string } }
    FeatureVersion:
      type: object
      required: [feature_id, version, manifest, file_set_id, files, digest, artifact_size, created_at, state]
      properties:
        feature_id: { type: string }
        version: { type: string }
        manifest: { type: string, contentEncoding: base64 }
        file_set_id: { type: string, format: uuid }
        files: { type: object, additionalProperties: { type: string, format: uuid } }
        digest: { type: string, pattern: '^[a-f0-9]{64}$' }
        artifact_size: { type: integer, minimum: 0 }
        created_at: { type: string, format: date-time }
        state: { type: string }
    ContentModel:
      type: object
      additionalProperties: false
      required: [version, model_revision, digest, data_model]
      properties:
        version: { type: integer, const: 1 }
        model_revision: { type: integer, minimum: 1 }
        digest: { type: string, pattern: '^[a-f0-9]{64}$' }
        data_model: { type: object, description: Canonical system-wide flat data model, shared across pages. }
    PagePlacementProjection:
      type: object
      additionalProperties: false
      required: [version, page_id, page_snapshot_id, revision, digest, state, placements]
      properties:
        version: { type: integer, const: 1 }
        page_id: { type: string, format: uuid }
        page_snapshot_id: { type: string, format: uuid }
        revision: { type: integer, minimum: 1 }
        digest: { type: string, pattern: '^[a-f0-9]{64}$' }
        state: { type: string, enum: [provisioning, ready, failed] }
        placements:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, page_id, page_name, feature_key, feature_name, version, bindings]
            properties:
              id: { type: string }
              page_id: { type: string, format: uuid }
              page_name: { type: string }
              feature_key: { type: string }
              feature_name: { type: string, description: Fallback display name; outer composition may replace from the pinned manifest. }
              version: { type: string }
              bindings:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [input_key, entity_id]
                  properties:
                    input_key: { type: string }
                    entity_id: { type: string, format: uuid }
                    field_id: { type: string, format: uuid }
                    fields:
                      type: array
                      items: { type: object, required: [input_path, field_id], properties: { input_path: { type: string }, field_id: { type: string, format: uuid } } }
                    lookup: { type: object, required: [argument, field_id], properties: { argument: { type: string }, field_id: { type: string, format: uuid } } }
                    detail_seo:
                      type: object
                      properties:
                        title_field_id: { type: string, format: uuid }
                        description_field_id: { type: string, format: uuid }
                        og_title_field_id: { type: string, format: uuid }
                        og_description_field_id: { type: string, format: uuid }
                        og_image_field_id: { type: string, format: uuid }
    PagePage:
      type: object
      required: [items]
      properties: { items: { type: array, items: { $ref: '#/components/schemas/Page' } }, next_cursor: { type: string } }
    Page:
      type: object
      required: [id, name, revision, lifecycle_state, latest_snapshot_id, latest_snapshot_state, created_at]
      properties:
        id: { type: string, format: uuid, description: Server-generated, stable page identity; never reused. }
        name: { type: string, minLength: 1, maxLength: 120 }
        revision: { type: integer, minimum: 1 }
        lifecycle_state: { type: string, enum: [active, retiring, retired] }
        retirement_job_id: { type: string, format: uuid }
        latest_snapshot_id: { type: string, format: uuid }
        latest_snapshot_state: { type: string, enum: [provisioning, ready, failed] }
        created_at: { type: string, format: date-time }
    PageRetirement:
      type: object
      additionalProperties: false
      required: [id, page_id, state, routes]
      properties:
        id: { type: string, format: uuid }
        page_id: { type: string, format: uuid }
        state: { type: string, enum: [queued, running, succeeded, retryable_failed] }
        routes:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [route_id, state]
            properties:
              route_id: { type: string, format: uuid }
              state: { type: string, enum: [pending, removed, retryable_failed] }
              error_code: { type: string }
    PageTemplatePage:
      type: object
      required: [items]
      properties: { items: { type: array, items: { $ref: '#/components/schemas/PageTemplate' } }, next_cursor: { type: string } }
    PageTemplate:
      type: object
      required: [id, name, description, revision, digest, configuration, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 1000 }
        revision: { type: integer, minimum: 1 }
        digest: { type: string, pattern: '^[a-f0-9]{64}$' }
        configuration: { $ref: '#/components/schemas/PageTemplateConfiguration' }
        updated_at: { type: string, format: date-time }
    PageTemplateConfiguration:
      type: object
      additionalProperties: false
      required: [schema_version, payload, feature_pins]
      properties:
        schema_version: { type: integer, const: 1 }
        payload: { $ref: '#/components/schemas/SnapshotPayload' }
        feature_pins: { type: object, additionalProperties: { type: string } }
        placement_slots:
          type: array
          description: Ordered insertion positions using the existing Website placement contract; these do not create HTML wrappers. Any available feature may be added to a valid position.
          items:
            type: object
            additionalProperties: false
            required: [id, label]
            properties:
              id: { type: string, minLength: 1, maxLength: 128 }
              label: { type: string, minLength: 1, maxLength: 120 }
    PageTemplateApplication:
      type: object
      required: [template_id, template_revision, page_id, page_snapshot_id]
      properties:
        template_id: { type: string, format: uuid }
        template_revision: { type: integer, minimum: 1 }
        page_id: { type: string, format: uuid }
        page_snapshot_id: { type: string, format: uuid }
    Snapshot:
      type: object
      required: [id, page_id, name, sequence, revision, feature_pins, state]
      properties:
        id: { type: string, format: uuid }
        page_id: { type: string, format: uuid }
        parent_id: { type: string, format: uuid, description: Parent snapshot must belong to the same page_id tree. }
        parent_name: { type: string }
        parent_sequence: { type: integer, minimum: 1 }
        name: { type: string, minLength: 1, maxLength: 120 }
        sequence: { type: integer, minimum: 1 }
        revision: { type: integer, minimum: 1 }
        content_revision: { type: integer, minimum: 0 }
        digest: { type: string }
        created_at: { type: string, format: date-time }
        feature_pins: { type: object, additionalProperties: { type: string } }
        state: { type: string, enum: [provisioning, ready, failed] }
        payload: { $ref: '#/components/schemas/SnapshotPayload' }
    SnapshotPayload:
      type: object
      additionalProperties: false
      required: [config, metadata]
      x-max-serialized-bytes: 9437184
      properties:
        config: { type: object, description: 'Versioned single-page Website structure; excludes the system-wide data_model, routes, URLs and hosts.', x-max-serialized-bytes: 8388608 }
        metadata: { type: object, description: Versioned page metadata., x-max-serialized-bytes: 1048576 }
    SnapshotPage:
      type: object
      required: [items]
      properties: { items: { type: array, items: { $ref: '#/components/schemas/Snapshot' } }, next_cursor: { type: string } }
    BuildJob:
      type: object
      required: [id, snapshot_id, locale, locale_catalog_revision, input_digest, state, created_at, updated_at]
      properties:
        id: { type: string }
        snapshot_id: { type: string, format: uuid }
        locale: { type: string, minLength: 2, maxLength: 64 }
        locale_catalog_revision: { type: integer, minimum: 1 }
        input_digest: { type: string, pattern: '^[a-f0-9]{64}$', description: Digest of the immutable locale-bound build inputs. }
        state: { type: string }
        artifact_manifest_file_id: { type: string, format: uuid }
        error_code: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    MediaJob:
      type: object
      additionalProperties: false
      required: [id, source_file_id, profile_digest, processor_version, state, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        source_file_id: { type: string, format: uuid }
        profile_digest: { type: string, pattern: '^[a-f0-9]{64}$' }
        processor_version: { type: string, minLength: 1, maxLength: 128 }
        state: { type: string, enum: [queued, running, ready, retryable_failed, rejected, cancelled] }
        outputs: { type: object, additionalProperties: { type: string, format: uuid }, description: Rendition name to immutable derivative Core file ID; present only when ready. }
        error_code: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Error:
      type: object
      required: [error]
      properties: { error: { type: string } }
  responses:
    Error:
      description: Stable machine-readable error.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
