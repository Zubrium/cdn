openapi: 3.1.0
info:
  title: Zubrium Forms Admin API
  version: 2.0.0
  description: >-
    Explicitly typed form schemas and immutable submissions. Forms Engine owns
    visitor sessions and lifecycle validation. Public HTTP sessions use
    Router-managed cookies; public attachment bytes are uploaded through Loader.
    Submitted answers can be viewed, exported or deleted; edits to answers are not supported.
servers: [{ url: / }]
security:
  - AdminSession: []
  - BearerCredential: []
x-rejects-cookie-and-bearer-together: true
paths:
  /api/admin/forms/schemas:
    get:
      operationId: listFormSchemas
      x-required-group-level: { group: forms_schemas, level: 1 }
      parameters:
        - { $ref: '#/components/parameters/SnapshotID' }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { description: Form schemas., content: { application/json: { schema: { $ref: '#/components/schemas/SchemaPage' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    put:
      operationId: saveFormSchema
      x-required-group-level: { group: forms_schemas, level: 2 }
      x-csrf-required-for-cookie-auth: true
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SaveSchema' } } }
      responses:
        '200': { description: Saved schema., content: { application/json: { schema: { $ref: '#/components/schemas/Schema' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/admin/forms/schemas/{schemaID}:
    get:
      operationId: getFormSchema
      x-required-group-level: { group: forms_schemas, level: 1 }
      parameters:
        - { name: schemaID, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/SnapshotID' }
      responses:
        '200': { description: Form schema., content: { application/json: { schema: { $ref: '#/components/schemas/Schema' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/admin/forms/submissions:
    get:
      operationId: listFormSubmissions
      x-required-group-level: { group: forms_submissions, level: 1 }
      parameters:
        - { $ref: '#/components/parameters/SnapshotID' }
        - { name: form_id, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string, maxLength: 64 } }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { description: Submission page; inaccessible submissions are omitted., content: { application/json: { schema: { $ref: '#/components/schemas/SubmissionPage' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /api/admin/forms/submissions/export:
    get:
      operationId: exportFormSubmissions
      x-required-group-level: { group: forms_submissions, level: 1 }
      description: >-
        Traverses accessible submissions with the same snapshot, form and state filters as the list endpoint.
        Cursor pages are independent Core reads and do not form a transactional snapshot. The response is a complete
        UTF-8 CSV or an error; it never returns a partial export. Formula-like answer
        strings are prefixed with an apostrophe. Operator limits are configured with forms_api.export_max_concurrent,
        forms_api.export_max_rows and forms_api.export_max_bytes.
      parameters:
        - { $ref: '#/components/parameters/SnapshotID' }
        - { name: form_id, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string, maxLength: 64 } }
      responses:
        '200':
          description: Complete CSV with metadata columns and a JSON-encoded values_json column.
          headers:
            Content-Disposition: { schema: { type: string } }
            Cache-Control: { schema: { type: string, const: no-store } }
          content: { text/csv: { schema: { type: string, format: binary } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '429': { description: All configured export slots are occupied; retry after the indicated delay., headers: { Retry-After: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '413': { description: Export exceeds the configured row or byte limit; no CSV is returned., content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '503': { $ref: '#/components/responses/Error' }
  /api/admin/forms/submissions/{submissionID}:
    get:
      operationId: getFormSubmission
      x-required-group-level: { group: forms_submissions, level: 1 }
      parameters:
        - { name: submissionID, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/SnapshotID' }
      responses:
        '200': { description: Submission with immutable answer values., headers: { ETag: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/Submission' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteFormSubmission
      x-required-group-level: { group: forms_submissions, level: 2 }
      x-csrf-required-for-cookie-auth: true
      parameters:
        - { name: submissionID, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/SnapshotID' }
        - name: If-Match
          in: header
          required: true
          schema: { type: string, pattern: '^"r[1-9][0-9]*"$' }
      responses:
        '204': { description: Submission and all its upload attachments were deleted. }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/admin/forms/submissions/{submissionID}/status:
    patch:
      operationId: setFormSubmissionStatus
      x-required-group-level: { group: forms_submissions, level: 2 }
      x-csrf-required-for-cookie-auth: true
      parameters: [{ name: submissionID, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, additionalProperties: false, required: [snapshot_id, status, expected_revision], properties: { snapshot_id: { type: string }, status: { type: string, maxLength: 64 }, expected_revision: { type: integer, minimum: 1 } } } } }
      responses:
        '200': { description: Status changed; answer values remain immutable., headers: { ETag: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/Submission' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    AdminSession: { type: apiKey, in: cookie, name: zubrium_admin_session }
    BearerCredential: { type: http, scheme: bearer }
  parameters:
    SnapshotID: { name: snapshot_id, in: query, required: true, schema: { type: string } }
    Cursor: { name: cursor, in: query, schema: { type: string, maxLength: 1024 } }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500 } }
  schemas:
    Schema:
      type: object
      additionalProperties: false
      required: [id, key, version, fields, revision]
      properties:
        id: { type: string, format: uuid }
        key: { type: string, minLength: 1, maxLength: 128, description: Stable schema key used by engine integrations. }
        version: { type: integer, minimum: 1 }
        fields:
          type: object
          minProperties: 1
          maxProperties: 128
          propertyNames: { type: string, pattern: '^[a-z][a-z0-9_]{0,63}$' }
          additionalProperties: { $ref: '#/components/schemas/FieldDefinition' }
        revision: { type: integer, minimum: 1 }
    FieldDefinition:
      oneOf:
        - type: object
          additionalProperties: false
          required: [type, required]
          properties:
            type: { const: text }
            required: { type: boolean }
            min_length: { type: integer, minimum: 0, maximum: 1048576 }
            max_length: { type: integer, minimum: 1, maximum: 1048576 }
            pattern: { type: string, maxLength: 256, description: Go RE2 regular expression. }
        - type: object
          additionalProperties: false
          required: [type, required]
          properties:
            type: { const: email }
            required: { type: boolean }
            min_length: { type: integer, minimum: 0, maximum: 1048576 }
            max_length: { type: integer, minimum: 1, maximum: 1048576 }
            pattern: { type: string, maxLength: 256, description: Go RE2 regular expression. }
        - type: object
          additionalProperties: false
          required: [type, required]
          properties:
            type: { const: number }
            required: { type: boolean }
            minimum: { type: number }
            maximum: { type: number }
        - type: object
          additionalProperties: false
          required: [type, required]
          properties:
            type: { const: boolean }
            required: { type: boolean }
        - type: object
          additionalProperties: false
          required: [type, required, options]
          properties:
            type: { const: select }
            required: { type: boolean }
            options:
              type: array
              minItems: 1
              maxItems: 128
              uniqueItems: true
              items: { type: string, minLength: 1, maxLength: 256 }
        - type: object
          additionalProperties: false
          required: [type, required, max_files, max_file_bytes, allowed_content_types]
          properties:
            type: { const: file }
            required: { type: boolean }
            max_files: { type: integer, minimum: 1, maximum: 20 }
            max_file_bytes: { type: integer, minimum: 1 }
            allowed_content_types:
              type: array
              minItems: 1
              maxItems: 32
              uniqueItems: true
              items:
                type: string
                pattern: '^[A-Za-z0-9!#$&^_.+-]+/[A-Za-z0-9!#$&^_.+-]+$'
              description: Exact non-active MIME type. Active types are rejected case-insensitively by the server.
              not: { enum: [application/ecmascript, application/javascript, application/x-httpd-php, application/xhtml+xml, application/xml, image/svg+xml, text/css, text/html, text/javascript, text/xml] }
    SaveSchema:
      type: object
      additionalProperties: false
      required: [snapshot_id, key, fields, expected_revision]
      properties:
        snapshot_id: { type: string, format: uuid }
        schema_id: { type: string, format: uuid, minLength: 1 }
        key: { type: string, minLength: 1, maxLength: 128 }
        fields:
          type: object
          minProperties: 1
          maxProperties: 128
          propertyNames: { type: string, pattern: '^[a-z][a-z0-9_]{0,63}$' }
          additionalProperties: { $ref: '#/components/schemas/FieldDefinition' }
        expected_revision: { type: integer, minimum: 0 }
      oneOf:
        - not: { required: [schema_id] }
          properties: { expected_revision: { const: 0 } }
        - required: [schema_id]
          properties: { expected_revision: { type: integer, minimum: 1 } }
    SchemaPage:
      type: object
      required: [items]
      properties: { items: { type: array, items: { $ref: '#/components/schemas/Schema' } }, next_cursor: { type: string } }
    Submission:
      type: object
      required: [id, form_id, schema_version, state, values, created_at, revision]
      properties:
        id: { type: string, format: uuid }
        form_id: { type: string }
        schema_version: { type: integer, minimum: 1 }
        state: { type: string }
        values: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }
        revision: { type: integer, minimum: 1 }
    SubmissionPage:
      type: object
      required: [items]
      properties: { items: { type: array, items: { $ref: '#/components/schemas/Submission' } }, next_cursor: { type: string } }
    Error:
      type: object
      required: [error]
      properties: { error: { type: string } }
  responses:
    Error:
      description: Stable machine-readable error.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
